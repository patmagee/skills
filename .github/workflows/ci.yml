name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run skill Python tests
        run: |
          set -e
          # Do not add "-t ." here: these tests directories have no __init__.py, and
          # "-t ." makes unittest discover treat the repo root as the package root,
          # which fails with "ImportError: Start directory is not importable".
          for dir in skills/*/tests; do
            [ -d "$dir" ] || continue
            echo "== $dir"
            python3 -m unittest discover -s "$dir"
          done

      - name: Validate skill frontmatter and manifest versions
        run: npm run validate

      - name: Check generated artifacts are in sync
        run: |
          npm run generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated artifacts are stale. Run 'npm run generate' and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi
